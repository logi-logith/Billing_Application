# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5443/your_database_name
spring.datasource.username=your_username
spring.datasource.password=your_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Settings
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

#Server_Port_Config
server.port=8080

management.endpoints.web.exposure.include=health,info

# Secret must be 256-bit minimum (32+ characters)
jwt.secret=Jo5DzQ3wG9Kc10sPUioKtbCF1AyTxMvD
jwt.expiration-ms=3600000

admin.secret-key=your_admin_secret

# Keep Spring Security at INFO — TRACE floods the logs with filter chain details
logging.level.org.springframework.security=INFO
logging.level.io.github.logith.billing_application=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{36} - %msg%n
