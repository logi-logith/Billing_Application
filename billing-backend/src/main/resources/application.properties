#DB_Config
spring.datasource.url=jdbc:mysql://localhost:3306/billing_db
spring.datasource.username=root
spring.datasource.password=Root@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

#Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.schemas=billing_db

#Server_Port_Config
server.port=8080

management.endpoints.web.exposure.include=health,info

# Secret must be 256-bit minimum (32+ characters)
jwt.secret=Jo5DzQ3wG9Kc10sPUioKtbCF1AyTxMvD
jwt.expiration-ms=3600000

admin.secret-key=adminSecret@123

# Keep Spring Security at INFO — TRACE floods the logs with filter chain details
logging.level.org.springframework.security=INFO
logging.level.io.github.logith.billing_application=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%-5level] %logger{36} - %msg%n
